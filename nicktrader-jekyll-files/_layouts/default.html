<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} · NickTrader</title>
<style>
  :root{
    --bg:#0b0d12; --bg2:#12151d; --card:#181c26; --line:#2a3140;
    --gold:#c9a227; --gold-l:#e6c65c; --txt:#e8eaf0; --sub:#9aa3b5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.85}
  a{color:var(--gold-l);text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px}
  nav{position:sticky;top:0;z-index:99;background:rgba(11,13,18,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
  .logo{color:var(--gold);font-weight:700;font-size:16px}
  .nav-links a{color:var(--sub);margin-left:18px;font-size:13.5px}
  .nav-links a:hover{color:var(--gold-l)}
  article{padding:60px 0 80px}
  .post-meta{color:var(--gold);font-size:13px;letter-spacing:1px;margin-bottom:14px}
  h1{font-size:32px;line-height:1.4;margin-bottom:28px}
  h2{font-size:23px;margin:36px 0 14px;color:var(--gold-l)}
  h3{font-size:18px;margin:26px 0 12px}
  p{margin-bottom:16px;font-size:16px;color:#d5d9e2}
  strong{color:var(--gold-l)}
  blockquote{border-left:3px solid var(--gold);background:var(--bg2);border-radius:0 10px 10px 0;padding:16px 20px;margin:20px 0;color:var(--sub)}
  ul,ol{margin:0 0 18px 24px}
  li{margin-bottom:8px;color:#d5d9e2}
  code{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:14px;font-family:monospace}
  pre{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto;margin-bottom:18px}
  pre code{background:none;border:none;padding:0}
  img{max-width:100%;border-radius:10px;margin:14px 0}
  hr{border:none;border-top:1px solid var(--line);margin:36px 0}
  .back{display:inline-block;margin-top:40px;font-size:14px;border:1px solid var(--line);padding:10px 22px;border-radius:8px;color:var(--txt)}
  .back:hover{border-color:var(--gold)}
  footer{border-top:1px solid var(--line);padding:28px 0;color:var(--sub);font-size:12px;text-align:center}
</style>
</head>
<body>
<nav><div class="wrap">
  <div class="logo">⚡ NICKTRADER</div>
  <div class="nav-links">
    <a href="/#about">关于我</a><a href="/#teach">交易教学</a><a href="/#cognition">认知方法论</a><a href="/#tools">交易工具</a>
  </div>
</div></nav>

<article><div class="wrap">
  <div class="post-meta">{{ page.date | date: "%Y-%m-%d" }} · NickTrader</div>
  <h1>{{ page.title }}</h1>
  {{ content }}
  <a class="back" href="/#cognition">← 返回认知方法论</a>
</div></article>

<footer><div class="wrap">© 2026 NickTrader · 个人交易记录与认知分享，不构成投资建议</div></footer>
</body>
</html>
